      - name: Patch CMakeLists.txt (Abseil + rapidjson + fixes)
        run: |
          python3 - <<'PYEOF'
          path = "cpp_engine/UnityFPSUnlocker/CMakeLists.txt"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          # 1. Abseil FetchContent
          fetch_block = '''include(FetchContent)
FetchContent_Declare(
  absl
  GIT_REPOSITORY https://github.com/abseil/abseil-cpp.git
  GIT_TAG        20240722.0
)
set(ABSL_PROPAGATE_CXX_STD ON CACHE BOOL "" FORCE)
set(ABSL_BUILD_TESTING OFF CACHE BOOL "" FORCE)
set(BUILD_TESTING OFF CACHE BOOL "" FORCE)
FetchContent_MakeAvailable(absl)
'''
          if "find_package(absl REQUIRED)" in content:
              content = content.replace("find_package(absl REQUIRED)", fetch_block.rstrip())
          else:
              print("Warning: find_package(absl) not found, appending FetchContent")
              content = content.replace("project(", "project(\n" + fetch_block + "\n", 1)

          # 2. rapidjson include path 強化（これが重要）
          include_block = '''include_directories(
    .
    third/rapidjson
    third/rapidjson/include
    third/rapidjson/include/rapidjson
    UnityFPSUnlocker
    utility
    third/xdl
'''
          if "include_directories(" in content:
              content = content.replace("include_directories(", include_block)
          else:
              # include_directoriesが存在しない場合に追加
              content = content.replace("project(", include_block + "\nproject(", 1)

          # 3. その他の修正
          content = content.replace("set(LIBRARY_OUTPUT_PATH ${PROJECT_SOURCE_DIR}/libs/${CMAKE_BUILD_TYPE}/)", "# Disabled")
          content = content.replace("set_target_properties(${LibraryName} PROPERTIES PREFIX \"\")", "# Disabled")
          content = content.replace("set_target_properties(${LibraryName} PROPERTIES OUTPUT_NAME ${ANDROID_ABI})", "# Disabled for Gradle")
          content = content.replace("set(CMAKE_C_VISIBILITY_PRESET hidden)", "# Disabled for JNI")
          content = content.replace("set(CMAKE_CXX_VISIBILITY_PRESET hidden)", "# Disabled for JNI")

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("✅ CMakeLists.txt successfully patched for rapidjson + Abseil")
          PYEOF
