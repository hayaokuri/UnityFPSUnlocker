name: Build Zygisk Module

on:
  push:
    branches: [ "zygisk_module" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Zygisk Branch
        uses: actions/checkout@v4
        with:
          ref: zygisk_module
          submodules: recursive

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Build Native Library
        run: |
          cd UnityFPSUnlocker
          rm -rf build
          mkdir -p build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-28 \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_VERBOSE_MAKEFILE=ON ..
          cmake --build . --parallel --verbose

          mkdir -p ../../magisk_module/zygisk
          cp -v libUnityFPSUnlocker.so ../../magisk_module/zygisk/arm64-v8a.so || echo "=== .so not found ==="
          ls -lh ../../magisk_module/zygisk/   # サイズ確認
          
      - name: Package Magisk Module
        run: |
          cd magisk_module
          cat > module.prop <<EOF
          id=unityfpsunlocker_zygisk
          name=UnityFPSUnlocker Zygisk
          version=v12-zygisk
          versionCode=12
          author=M2ki
          description=#コンパス 60fps + Anti-Detection (Zygisk)
          EOF

          mkdir -p META-INF/com/google/android
          echo '#!/sbin/sh\necho "UnityFPSUnlocker Zygisk installed"' > META-INF/com/google/android/update-binary
          chmod +x META-INF/com/google/android/update-binary

          zip -r9 ../UnityFPSUnlocker-Zygisk.zip .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: UnityFPSUnlocker-Zygisk
          path: UnityFPSUnlocker-Zygisk.zip
