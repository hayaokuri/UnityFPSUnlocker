name: Build Xposed Module (Clean)
on:
  push:
    branches: [ "xposed" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Xposed Branch (Java Wrapper)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Zygisk Branch (C++ Engine)
        uses: actions/checkout@v4
        with:
          ref: zygisk_module
          path: cpp_engine
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Patch CMakeLists.txt
        run: python3 .github/scripts/patch_cmake.py

      - name: Build APK with Gradle
        run: |
          echo "Gradle build starting..."
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UnityFPSUnlocker-Xposed
          path: app/build/outputs/apk/debug/*.apk
