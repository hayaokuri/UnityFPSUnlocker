name: Build Zygisk Module (Stealth Mode)

on:
  push:
    branches: [ "zygisk_module" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Zygisk Engine
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Patch CMakeLists.txt (Abseil fix)
        run: |
          python3 - <<'PYEOF'
          # CMakeLists.txtの場所（ルートかUnityFPSUnlockerフォルダ内か）を自動で探す
          import os, glob
          path = next(glob.iglob("**/CMakeLists.txt", recursive=True), None)
          if path:
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              
              fetch_block = '''include(FetchContent)\nFetchContent_Declare(\n  absl\n  GIT_REPOSITORY https://github.com/abseil/abseil-cpp.git\n  GIT_TAG        20240722.0\n)\nset(ABSL_PROPAGATE_CXX_STD ON CACHE BOOL "" FORCE)\nset(ABSL_BUILD_TESTING OFF CACHE BOOL "" FORCE)\nset(BUILD_TESTING OFF CACHE BOOL "" FORCE)\nFetchContent_MakeAvailable(absl)\n'''
              content = content.replace("find_package(absl REQUIRED)", fetch_block.rstrip())
              
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          PYEOF

      - name: Build Zygisk Magisk Module
        run: |
          echo "Zygiskモジュールとしてのビルドを開始します..."
          # Zygiskテンプレートの標準ビルドコマンドを実行
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Upload Magisk Module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: UnityFPSUnlocker-Zygisk-Module
          path: out/*.zip
