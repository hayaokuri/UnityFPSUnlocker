name: Build Xposed Module (Clean)

on:
  push:
    branches: [ "xposed" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Xposed Branch (Java Wrapper)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Zygisk Branch (C++ Engine)
        uses: actions/checkout@v4
        with:
          ref: zygisk_module
          path: cpp_engine
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Patch CMakeLists.txt for Abseil & Output Name
        run: |
          python3 - <<'PYEOF'
          path = "cpp_engine/UnityFPSUnlocker/CMakeLists.txt"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          
          # Abseilのエラー回避パッチ
          fetch_block = '''include(FetchContent)\nFetchContent_Declare(\n  absl\n  GIT_REPOSITORY https://github.com/abseil/abseil-cpp.git\n  GIT_TAG        20240722.0\n)\nset(ABSL_PROPAGATE_CXX_STD ON CACHE BOOL "" FORCE)\nset(ABSL_BUILD_TESTING OFF CACHE BOOL "" FORCE)\nset(BUILD_TESTING OFF CACHE BOOL "" FORCE)\nFetchContent_MakeAvailable(absl)\n'''
          content = content.replace("find_package(absl REQUIRED)", fetch_block.rstrip())
          
          # Gradleが正しい名前で認識できるように、CMake側のリネーム処理を無効化する
          content = content.replace("set_target_properties(${LibraryName} PROPERTIES OUTPUT_NAME ${ANDROID_ABI})", "# Disabled for Gradle build")
          
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF

      - name: Build APK with Gradle (Java + C++ Auto Build)
        run: |
          echo "GradleでJavaとC++をまとめて完全ビルドします..."
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UnityFPSUnlocker-Xposed-Clean
          path: app/build/outputs/apk/debug/*.apk
