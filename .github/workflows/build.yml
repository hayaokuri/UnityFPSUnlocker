name: Build Xposed Module (Full)

on:
  push:
    branches: [ "xposed" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build C++ Engine (CMake)
        run: |
          echo "C++のビルドを開始します..."
          mkdir -p build_arm64
          cd build_arm64
          
          # cpp_engineディレクトリ内のCMakeLists.txtを使ってコンパイル
          cmake ../cpp_engine \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-27 \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          
          echo "ビルドした.soファイルを配置・リネームします..."
          # Gradleが自動で読み込む jniLibs フォルダを作成
          mkdir -p ../app/src/main/jniLibs/arm64-v8a/
          
          # cpp_engine側に出力されたファイルを、正しい名前にリネームしてコピー
          cp ../cpp_engine/libs/Release/arm64-v8a.so ../app/src/main/jniLibs/arm64-v8a/libUnityFPSUnlocker.so
          cd ..

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK (Java + C++)
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UnityFPSUnlocker-Xposed-Complete
          path: app/build/outputs/apk/debug/*.apk
