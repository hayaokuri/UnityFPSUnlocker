name: Build Xposed Module (Full)
on:
  push:
    branches: [ "xposed" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (xposed branch)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout C++ Engine (zygisk_module branch)
        uses: actions/checkout@v4
        with:
          ref: zygisk_module
          path: cpp_engine
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build C++ Engine (CMake)
        run: |
          echo "C++のビルドを開始します..."
          mkdir -p build_arm64
          cd build_arm64

          cmake ../cpp_engine \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-27
          make

          echo "ビルドした.soファイルを配置します..."
          mkdir -p ../app/src/main/libs/arm64-v8a/
          find . -name "*.so" -exec cp {} ../app/src/main/libs/arm64-v8a/ \;
          cd ..

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK (Java + C++)
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UnityFPSUnlocker-Xposed-Complete
          path: app/build/outputs/apk/debug/*.apk
