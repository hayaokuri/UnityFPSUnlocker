name: Build Zygisk Module

on:
  push:
    branches: [ "zygisk_module" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Zygisk Branch
        uses: actions/checkout@v4
        with:
          ref: zygisk_module
          submodules: recursive

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Build Native Library
        run: |
          cd UnityFPSUnlocker
          rm -rf build
          mkdir -p build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-28 \
                -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --parallel --verbose

          mkdir -p ../../magisk_module/zygisk
          cp -v libUnityFPSUnlocker.so ../../magisk_module/zygisk/arm64-v8a.so || echo "=== COPY FAILED ==="
          ls -lh ../../magisk_module/zygisk/

      - name: Package Magisk Module
        run: |
          cd magisk_module
          cat > module.prop <<EOF
          id=unityfpsunlocker_zygisk
          name=UnityFPSUnlocker Zygisk
          version=v13-zygisk
          versionCode=13
          author=M2ki
          description=#コンパス FPS Unlock + Anti Detection (Zygisk)
          minMagisk=27000
          EOF

          mkdir -p META-INF/com/google/android
          cat > META-INF/com/google/android/update-binary <<'EOF'
#!/sbin/sh
echo "UnityFPSUnlocker Zygisk installed"
ui_print "UnityFPSUnlocker Zygisk installed"
EOF
          chmod +x META-INF/com/google/android/update-binary

          zip -r9 ../UnityFPSUnlocker-Zygisk.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnityFPSUnlocker-Zygisk
          path: UnityFPSUnlocker-Zygisk.zip
