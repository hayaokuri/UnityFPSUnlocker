name: Build Zygisk Module (Pure C++)

on:
  push:
    branches: [ "zygisk_module" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Zygisk Engine
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Patch CMakeLists.txt (Abseil fix)
        run: |
          python3 - <<'PYEOF'
          path = "UnityFPSUnlocker/CMakeLists.txt"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          
          fetch_block = '''include(FetchContent)\nFetchContent_Declare(\n  absl\n  GIT_REPOSITORY https://github.com/abseil/abseil-cpp.git\n  GIT_TAG        20240722.0\n)\nset(ABSL_PROPAGATE_CXX_STD ON CACHE BOOL "" FORCE)\nset(ABSL_BUILD_TESTING OFF CACHE BOOL "" FORCE)\nset(BUILD_TESTING OFF CACHE BOOL "" FORCE)\nFetchContent_MakeAvailable(absl)\n'''
          content = content.replace("find_package(absl REQUIRED)", fetch_block.rstrip())
          
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF

      - name: Build with CMake
        run: |
          echo "C++エンジンを直接コンパイルします..."
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-28 \
                -DCMAKE_BUILD_TYPE=Release \
                ..
          cmake --build . --parallel

      - name: Package Magisk Module
        run: |
          echo "Magisk/Zygiskモジュールの形にパッケージングします..."
          mkdir magisk_module
          cd magisk_module
          
          # module.propの作成
          cat <<EOF > module.prop
          id=unityfpsunlocker_zygisk
          name=UnityFPSUnlocker (Zygisk Stealth)
          version=v1.0
          versionCode=1
          author=M2ki
          description=Unlocks FPS for Unity games via pure Zygisk (No LSPosed).
          EOF
          
          # Zygiskエンジン(.so)の配置
          mkdir zygisk
          cp ../libs/Release/arm64-v8a.so zygisk/arm64-v8a.so
          
          # ★ここを修正！絶対に消えない公式アーカイブのURLに変更
          mkdir -p META-INF/com/google/android
          curl -sL https://raw.githubusercontent.com/topjohnwu/magisk-module-template/master/META-INF/com/google/android/update-binary -o META-INF/com/google/android/update-binary
          curl -sL https://raw.githubusercontent.com/topjohnwu/magisk-module-template/master/META-INF/com/google/android/updater-script -o META-INF/com/google/android/updater-script
          chmod +x META-INF/com/google/android/update-binary
          
          # フォルダの中身をZIPファイルに圧縮
          zip -r9 ../UnityFPSUnlocker-Zygisk-Module.zip .

      - name: Upload Magisk Module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: UnityFPSUnlocker-Zygisk-Module
          path: UnityFPSUnlocker-Zygisk-Module.zip
