name: Build Xposed Module (Full)
on:
  push:
    branches: [ "xposed" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (xposed branch)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout C++ Engine (zygisk_module branch)
        uses: actions/checkout@v4
        with:
          ref: zygisk_module
          path: cpp_engine
          submodules: recursive

      - name: Patch CMakeLists.txt to fetch Abseil
        run: |
          CMAKE_FILE="cpp_engine/UnityFPSUnlocker/CMakeLists.txt"
          echo "=== パッチ前 ==="
          grep -n "find_package(absl" "$CMAKE_FILE"

          python3 - <<'PYEOF'
          path = "cpp_engine/UnityFPSUnlocker/CMakeLists.txt"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          fetch_block = '''include(FetchContent)
          FetchContent_Declare(
            absl
            GIT_REPOSITORY https://github.com/abseil/abseil-cpp.git
            GIT_TAG        20240722.0
          )
          set(ABSL_PROPAGATE_CXX_STD ON CACHE BOOL "" FORCE)
          set(ABSL_BUILD_TESTING OFF CACHE BOOL "" FORCE)
          set(BUILD_TESTING OFF CACHE BOOL "" FORCE)
          FetchContent_MakeAvailable(absl)

          '''

          content = content.replace(
              "find_package(absl REQUIRED)",
              fetch_block.rstrip()
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF

          echo "=== パッチ後 ==="
          cat "$CMAKE_FILE"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build C++ Engine (CMake)
        run: |
          echo "C++のビルドを開始します..."
          mkdir -p build_arm64
          cd build_arm64

          cmake ../cpp_engine \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-27 \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

          echo "ビルドした.soファイルを配置します..."
          mkdir -p ../app/src/main/libs/arm64-v8a/
          find . -name "*.so" -exec cp {} ../app/src/main/libs/arm64-v8a/ \;
          cd ..

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK (Java + C++)
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UnityFPSUnlocker-Xposed-Complete
          path: app/build/outputs/apk/debug/*.apk
