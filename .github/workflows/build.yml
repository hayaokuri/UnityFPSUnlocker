name: Build Xposed Module (Full)

on:
  push:
    branches: [ "xposed" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Java側（ガワ）のコードをxposedブランチから取得
      - name: Checkout Xposed Branch (Java Wrapper)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. C++側（心臓部）のコードをzygisk_moduleブランチから取得し、cpp_engineフォルダに入れる
      - name: Checkout Zygisk Branch (C++ Engine)
        uses: actions/checkout@v4
        with:
          ref: zygisk_module
          path: cpp_engine
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Abseilライブラリのビルドエラーを回避するためのパッチ処理
      - name: Patch CMakeLists.txt for Abseil
        run: |
          python3 - <<'PYEOF'
          path = "cpp_engine/UnityFPSUnlocker/CMakeLists.txt"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          
          fetch_block = '''include(FetchContent)
          FetchContent_Declare(
            absl
            GIT_REPOSITORY https://github.com/abseil/abseil-cpp.git
            GIT_TAG        20240722.0
          )
          set(ABSL_PROPAGATE_CXX_STD ON CACHE BOOL "" FORCE)
          set(ABSL_BUILD_TESTING OFF CACHE BOOL "" FORCE)
          set(BUILD_TESTING OFF CACHE BOOL "" FORCE)
          FetchContent_MakeAvailable(absl)
          '''
          
          content = content.replace("find_package(absl REQUIRED)", fetch_block.rstrip())
          
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF

      # 4. パッチを当てたC++エンジンをビルドして、正しい名前・正しい場所に配置
      - name: Build C++ Engine (CMake)
        run: |
          echo "C++のビルドを開始します..."
          mkdir -p build_arm64
          cd build_arm64
          
          cmake ../cpp_engine \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-27 \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          
          echo "ビルドした.soファイルを配置・リネームします..."
          mkdir -p ../app/src/main/jniLibs/arm64-v8a/
          cp ../cpp_engine/libs/Release/arm64-v8a.so ../app/src/main/jniLibs/arm64-v8a/libUnityFPSUnlocker.so
          cd ..

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK (Java + C++)
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UnityFPSUnlocker-Xposed-Complete
          path: app/build/outputs/apk/debug/*.apk
