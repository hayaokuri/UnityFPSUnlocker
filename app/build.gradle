plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.hexstr.UnityFPSUnlocker'
    compileSdk 34 // 36は未安定なので34を推奨

    defaultConfig {
        applicationId "io.github.hexstr.UnityFPSUnlocker" // ★文字列で直接指定！
        minSdk 28
        targetSdk 34 // ★ここも34へ
        versionCode 1
        versionName "1.0"

        // C++をコンパイルするための設定
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fno-rtti -fno-exceptions"
                abiFilters "arm64-v8a"
                arguments "-DANDROID_PLATFORM=android-28", "-DCMAKE_BUILD_TYPE=Release"
            }
        }
    }

    // C++のビルド指示書（CMakeLists.txt）の場所
    externalNativeBuild {
        cmake {
            path "../cpp_engine/UnityFPSUnlocker/CMakeLists.txt"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.3.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.preference:preference:1.2.1'
    compileOnly("de.robv.android.xposed:api:82")
}
